<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0e1330">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>BUCKETS: NBA AFK</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Baloo+2:wght@700;800&family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@500;600&display=swap" rel="stylesheet">
<style>
/* BUCKETS — night-arena broadcast identity
   night #0E1330 · deep #161C44 · hardwood #F0A23B · LED #FF6A1A · squad teal #2EE6C5 · cream #F4EBDD */
:root {
  --night: #0e1330; --deep: #161c44; --deep2: #1f2758; --wood: #f0a23b; --led: #ff6a1a; --teal: #2ee6c5; --cream: #f4ebdd; --mute: #8e95b8; --bad: #ff5a5a; --good: #46e678;
  --common: #9aa3bc; --rare: #4da3ff; --epic: #b06bff; --legendary: #ffc23d;
  --disp: 'Anton', Impact, 'Arial Narrow', sans-serif; --ui: 'Barlow Condensed', 'Arial Narrow', sans-serif; --body: 'Barlow', system-ui, sans-serif;
  box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --night: #0e1330; } }
:root[data-theme="dark"] { --night: #0e1330; }
*, *::before, *::after { box-sizing: inherit; -webkit-tap-highlight-color: transparent; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
html, body { margin: 0; height: 100%; background: var(--night); color: var(--cream); font-family: var(--body); overflow: hidden; overscroll-behavior: none; }
body { -webkit-user-select: none; user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
input, select { font: 600 16px var(--ui); color: var(--cream); background: var(--deep); border: 1px solid #2c3570; border-radius: 10px; padding: 9px 10px; min-width: 0; }
.hidden { display: none !important; }

#app { position: fixed; inset: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px) 0; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: radial-gradient(120% 80% at 50% -10%, #23307a 0%, var(--night) 55%) fixed; }
.screen.hidden { display: none; }

/* ---------- header ---------- */
.hdr { display: flex; align-items: center; gap: 8px; padding: 10px 12px; flex: none; }
.hdr h2 { font: 400 24px/1 var(--disp); letter-spacing: .5px; margin: 0; flex: 1; text-transform: uppercase; }
.back { width: 40px; height: 40px; border-radius: 12px; background: var(--deep); font: 700 20px var(--ui); display: grid; place-items: center; }
.pills { display: flex; gap: 6px; }
.pill { display: flex; align-items: center; gap: 5px; background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.08); border-radius: 999px; padding: 4px 10px 4px 6px; font: 700 15px var(--ui); white-space: nowrap; }
.pill i { font-style: normal; }
.body { flex: 1; overflow-y: auto; padding: 4px 12px 24px; -webkit-overflow-scrolling: touch; }

/* ---------- home ---------- */
.home-grid { flex: 1; display: grid; grid-template-columns: 1fr; gap: 12px; padding: 4px 14px 16px; overflow-y: auto; align-content: start; }
.logo { text-align: center; margin: 4px 0 0; }
.logo .b { font: 400 clamp(54px, 15vw, 84px)/0.86 var(--disp); letter-spacing: 1px; color: var(--cream); text-shadow: 0 4px 0 #0008, 0 0 24px rgba(255,106,26,.35); display: block; }
.logo .b span { color: var(--led); }
.logo .s { font: 700 15px var(--ui); letter-spacing: 6px; color: var(--wood); }
.squad { background: linear-gradient(160deg, var(--deep2), var(--deep)); border-radius: 18px; padding: 12px 14px; border: 1px solid #2c3570; }
.squad .nm { font: 400 22px var(--disp); text-transform: uppercase; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.squad .nm small { font: 600 13px var(--ui); color: var(--mute); }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.stat { background: rgba(0,0,0,.25); border-radius: 12px; padding: 8px; }
.stat b { display: block; font: 400 26px/1 var(--disp); }
.stat span { font: 600 12px var(--ui); color: var(--mute); }
.form { display: flex; gap: 4px; margin-top: 10px; align-items: center; font: 600 12px var(--ui); color: var(--mute); }
.form i { font-style: normal; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 6px; font: 700 13px var(--ui); color: #fff; }
.form i.w { background: #1f8a5a; } .form i.l { background: #7a2a36; }
.play { position: relative; display: block; width: 100%; border-radius: 20px; padding: 18px 10px 14px; font: 400 44px/1 var(--disp); letter-spacing: 3px; color: #1a0d00;
  background: linear-gradient(180deg, #ffb347, var(--led)); box-shadow: 0 6px 0 #a33c06, 0 0 40px rgba(255,106,26,.45); animation: playPulse 2.2s ease-in-out infinite; }
.play small { display: block; font: 700 14px var(--ui); letter-spacing: 1px; color: #4a1d00; margin-top: 4px; }
.play:active { transform: translateY(4px); box-shadow: 0 2px 0 #a33c06; }
@keyframes playPulse { 50% { box-shadow: 0 6px 0 #a33c06, 0 0 64px rgba(255,106,26,.7); } }
@media (prefers-reduced-motion: reduce) { .play { animation: none; } }
.chest { display: flex; align-items: center; gap: 10px; background: rgba(46,230,197,.08); border: 1px solid rgba(46,230,197,.35); border-radius: 16px; padding: 10px 12px; }
.chest .ic { font-size: 30px; }
.chest .tx { flex: 1; font: 600 14px var(--ui); color: var(--mute); }
.chest .tx b { display: block; font: 400 20px var(--disp); color: var(--cream); }
.btn { border-radius: 12px; padding: 10px 14px; font: 700 16px var(--ui); letter-spacing: .5px; background: var(--deep2); border: 1px solid #34407e; text-transform: uppercase; }
.btn.pri { background: var(--teal); color: #062a24; border-color: var(--teal); }
.btn.hot { background: var(--led); color: #1a0d00; border-color: var(--led); }
.btn.gold { background: var(--legendary); color: #2a1d00; border-color: var(--legendary); }
.btn:disabled { opacity: .4; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.nav { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.nav button { position: relative; background: var(--deep); border: 1px solid #2a336c; border-radius: 16px; padding: 12px 4px 10px; font: 700 14px var(--ui); letter-spacing: .5px; text-transform: uppercase; }
.nav button .e { display: block; font-size: 24px; margin-bottom: 2px; }
.badge { position: absolute; top: 6px; right: 8px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--led); color: #fff; font: 700 12px/18px var(--ui); padding: 0 5px; }
@media (orientation: landscape) and (max-height: 520px) {
  .home-grid { grid-template-columns: 1fr 1.15fr; grid-template-areas: "logo squad" "play chest" "play nav"; column-gap: 14px; row-gap: 8px; padding-top: 0; }
  .logo .b { font-size: 46px; } .logo .s { font-size: 12px; letter-spacing: 4px; }
  .squad { padding: 8px 12px; } .squad .nm { font-size: 18px; } .stats3 { margin-top: 6px; gap: 6px; } .stat { padding: 5px 8px; } .stat b { font-size: 20px; } .form { margin-top: 6px; }
  .chest { padding: 6px 10px; } .chest .ic { font-size: 22px; } .chest .tx b { font-size: 16px; } .chest .tx { font-size: 12px; }
  .nav { gap: 6px; } .nav button { padding: 6px 2px; font-size: 13px; } .nav button .e { font-size: 18px; display: inline; margin-right: 4px; }
  .play { padding: 22px 8px 16px !important; font-size: 52px !important; }
  .hdr { padding: 6px 12px; }
}
@media (orientation: landscape) and (min-width: 640px) {
  .home-grid { grid-template-columns: 1.05fr 1fr; grid-template-areas: "logo squad" "play chest" "play nav"; column-gap: 18px; }
  .logo { grid-area: logo; align-self: center; } .squad { grid-area: squad; } .playwrap { grid-area: play; align-self: stretch; display: flex; flex-direction: column; justify-content: center; } .chest { grid-area: chest; } .nav { grid-area: nav; }
  .play { padding: 30px 10px 22px; font-size: 56px; }
}

/* ---------- cards & lists ---------- */
.pcard { position: relative; border-radius: 14px; background: linear-gradient(165deg, #232c66, #151a3e); border: 2px solid var(--rc, var(--common)); padding: 8px; overflow: hidden; text-align: left; width: 100%; }
.pcard::after { content: ''; position: absolute; inset: 0; background: linear-gradient(120deg, transparent 40%, rgba(255,255,255,.07) 50%, transparent 60%); pointer-events: none; }
.r-common { --rc: var(--common); } .r-rare { --rc: var(--rare); } .r-epic { --rc: var(--epic); } .r-legendary { --rc: var(--legendary); }
.r-legendary { box-shadow: 0 0 18px rgba(255,194,61,.35); }
.ovr { font: 400 28px/0.9 var(--disp); color: var(--rc, var(--cream)); }
.ovr small { display: block; font: 700 10px var(--ui); letter-spacing: 1px; color: var(--mute); }
.jersey { width: 44px; height: 48px; border-radius: 10px 10px 8px 8px; background: var(--j1); color: var(--j2); display: grid; place-items: center; font: 400 22px var(--disp); box-shadow: inset 0 -6px 0 rgba(0,0,0,.18); border: 2px solid var(--j2); position: relative; flex: none; }
.jersey::before { content: ''; position: absolute; top: -2px; left: 50%; width: 16px; height: 8px; margin-left: -8px; background: var(--night); border-radius: 0 0 10px 10px; }
.tchip { display: inline-flex; align-items: center; gap: 4px; font: 700 12px var(--ui); color: var(--mute); }
.tchip i { width: 10px; height: 10px; border-radius: 3px; background: linear-gradient(135deg, var(--j1) 50%, var(--j2) 50%); }
.slots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.slot { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px 6px; text-align: center; }
.slot .pos { font: 700 12px var(--ui); color: var(--wood); letter-spacing: 1px; }
.slot .nm { font: 700 13px/1.05 var(--ui); text-transform: uppercase; min-height: 28px; }
.slot .lv { font: 600 11px var(--ui); color: var(--mute); }
.slot.empty { border-style: dashed; opacity: .6; }
.bench { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
@media (orientation: landscape) { .bench { grid-template-columns: repeat(3, 1fr); } }
.sec { font: 400 18px var(--disp); text-transform: uppercase; letter-spacing: .5px; margin: 16px 0 8px; color: var(--cream); display: flex; justify-content: space-between; align-items: baseline; }
.sec small { font: 600 13px var(--ui); color: var(--mute); text-transform: none; letter-spacing: 0; }
.meter { height: 10px; border-radius: 6px; background: rgba(255,255,255,.08); overflow: hidden; }
.meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--teal), #a6ffe9); border-radius: 6px; }
.notes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.note { font: 600 13px var(--ui); background: rgba(255,255,255,.06); border-radius: 8px; padding: 3px 8px; }
.note.syn { background: rgba(255,194,61,.15); color: var(--legendary); }
.note.neg { background: rgba(255,90,90,.15); color: #ffb0b0; }

.filters { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 0 12px 8px; flex: none; }
.filters input { grid-column: 1 / -1; }
@media (orientation: landscape) { .filters { grid-template-columns: 2fr 1fr 1fr 1fr 1fr; } .filters input { grid-column: auto; } }
.coll { padding: 0 12px 6px; font: 600 14px var(--ui); color: var(--mute); display: flex; gap: 10px; align-items: center; flex: none; }
.coll .meter { flex: 1; }
.vlist { flex: 1; overflow-y: auto; position: relative; -webkit-overflow-scrolling: touch; }
.vinner { position: relative; }
.row { position: absolute; left: 10px; right: 10px; height: 60px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: 12px; background: rgba(255,255,255,.035); border-left: 4px solid var(--rc); text-align: left; }
.row .jersey { width: 34px; height: 38px; font-size: 17px; }
.row .mid { flex: 1; min-width: 0; }
.row .mid b { display: block; font: 700 17px/1.1 var(--ui); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase; }
.row .key { text-align: right; font: 600 12px var(--ui); color: var(--mute); }
.row .key b { display: block; font: 400 20px var(--disp); color: var(--cream); }
.row.locked { opacity: .55; }
.tag { font: 700 10px var(--ui); letter-spacing: .5px; padding: 2px 5px; border-radius: 4px; background: rgba(255,255,255,.1); }
.tag.own { background: rgba(46,230,197,.2); color: var(--teal); } .tag.up { background: rgba(255,194,61,.2); color: var(--legendary); } .tag.dup { background: rgba(176,107,255,.2); color: #d7b6ff; }
.tag.imp { background: rgba(70,230,120,.2); color: var(--good); } .tag.der { background: rgba(142,149,184,.2); color: var(--mute); }

/* ---------- modal ---------- */
.modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(5,8,25,.72); padding: 12px; backdrop-filter: blur(3px); animation: fadeIn .15s; }
.sheet { width: min(560px, 100%); max-height: 100%; overflow-y: auto; background: linear-gradient(170deg, #1d2560, #12173a); border: 1px solid #34407e; border-radius: 20px; padding: 14px; position: relative; animation: popIn .2s cubic-bezier(.2,1.4,.5,1); }
.sheet.wide { width: min(760px, 100%); }
.sheet h3 { font: 400 24px var(--disp); margin: 0 0 8px; text-transform: uppercase; }
.x { position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; border-radius: 10px; background: rgba(255,255,255,.08); font: 700 18px var(--ui); }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes popIn { from { transform: scale(.92); opacity: 0; } }
.prof-top { display: flex; gap: 12px; align-items: center; padding-right: 44px; }
.prof-top .jersey { width: 64px; height: 70px; font-size: 32px; }
.prof-top .nm { font: 400 26px/1 var(--disp); text-transform: uppercase; }
.prof-top .sub { font: 600 14px var(--ui); color: var(--mute); margin-top: 4px; }
.attrs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; margin-top: 10px; }
.attr { display: grid; grid-template-columns: 1fr auto; gap: 2px 6px; align-items: center; font: 600 13px var(--ui); }
.attr .meter { grid-column: 1 / -1; height: 6px; }
.attr b { font: 400 16px var(--disp); }
.statline { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; text-align: center; margin-top: 6px; }
.statline div { background: rgba(0,0,0,.25); border-radius: 8px; padding: 6px 2px; font: 600 11px var(--ui); color: var(--mute); }
.statline b { display: block; font: 400 17px var(--disp); color: var(--cream); }
.acts { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.acts .btn { flex: 1; }
.cmp { display: grid; grid-template-columns: 1fr 70px 1fr; gap: 4px 8px; align-items: center; font: 600 13px var(--ui); }
.cmp .lab { text-align: center; color: var(--mute); }
.cmp .bar { height: 8px; border-radius: 4px; background: rgba(255,255,255,.08); position: relative; }
.cmp .bar i { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
.cmp .l i { right: 0; background: var(--teal); } .cmp .r i { left: 0; background: var(--led); }
.cmp .win { color: var(--cream); font-weight: 800; }

/* ---------- rewards etc ---------- */
.list { display: flex; flex-direction: column; gap: 8px; }
.item { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,.04); border: 1px solid #262f66; border-radius: 14px; padding: 10px 12px; }
.item .t { flex: 1; font: 700 16px var(--ui); }
.item .t small { display: block; font: 600 13px var(--ui); color: var(--mute); }
.item .meter { margin-top: 6px; }
.track { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.day { border-radius: 12px; background: var(--deep); border: 1px solid #2a336c; padding: 8px 2px; text-align: center; font: 700 12px var(--ui); color: var(--mute); }
.day b { display: block; font-size: 20px; margin: 2px 0; }
.day.done { opacity: .45; } .day.now { border-color: var(--legendary); color: var(--cream); box-shadow: 0 0 14px rgba(255,194,61,.35); }
.lbrow { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 12px; background: rgba(255,255,255,.035); font: 700 16px var(--ui); }
.lbrow .rk { font: 400 20px var(--disp); color: var(--mute); }
.lbrow.you { background: rgba(46,230,197,.14); border: 1px solid rgba(46,230,197,.5); }
.lbrow.top1 .rk { color: var(--legendary); }
.packs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pack { border-radius: 18px; padding: 16px 10px; text-align: center; background: linear-gradient(170deg, #263080, #141a44); border: 2px solid var(--rare); }
.pack.elite { border-color: var(--epic); background: linear-gradient(170deg, #3a1f6e, #18113a); }
.pack .e { font-size: 40px; } .pack b { display: block; font: 400 22px var(--disp); margin: 4px 0; } .pack small { display: block; font: 600 12px var(--ui); color: var(--mute); margin-bottom: 10px; }

/* reveal */
.reveal { text-align: center; }
.reveal .pcard { width: 210px; margin: 10px auto; padding: 18px 12px; animation: flip .7s cubic-bezier(.2,1.2,.4,1); }
.reveal .pcard .jersey { margin: 8px auto; width: 70px; height: 76px; font-size: 34px; }
.reveal .rar { font: 700 14px var(--ui); letter-spacing: 3px; color: var(--rc); }
@keyframes flip { from { transform: rotateY(90deg) scale(.7); } }

/* toast */
#toasts { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 10px); z-index: 90; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
.toast { background: rgba(10,14,40,.95); border: 1px solid #34407e; border-radius: 12px; padding: 8px 14px; font: 700 15px var(--ui); animation: popIn .2s; max-width: 90vw; }

/* welcome back */
.wb h3 { font-size: 30px; text-align: center; }
.wb .games { text-align: center; font: 600 15px var(--ui); color: var(--mute); }
.wb .big { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
.wb .big div { background: rgba(0,0,0,.25); border-radius: 14px; padding: 10px; text-align: center; font: 600 13px var(--ui); color: var(--mute); }
.wb .big b { display: block; font: 400 26px var(--disp); color: var(--cream); }

/* ad placeholder */
.ad { position: fixed; inset: 0; z-index: 95; background: #000; display: grid; place-items: center; text-align: center; font: 700 18px var(--ui); }
.ad b { display: block; font: 400 64px var(--disp); color: var(--led); }

/* ================= MATCH ================= */
.match { background: #04060f; overflow: hidden; }
.match canvas#court { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.scorebug { position: absolute; top: 6px; left: 50%; transform: translateX(-50%); display: flex; align-items: stretch; height: 40px; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,.6); font-family: var(--disp); z-index: 5; }
.sb-t { display: flex; align-items: center; gap: 6px; padding: 0 10px; background: var(--deep); }
.sb-t .ab { font: 700 14px var(--ui); letter-spacing: 1px; padding: 2px 6px; border-radius: 4px; color: #fff; }
.sb-t .sc { font-size: 26px; min-width: 34px; text-align: center; }
.sb-t.you .ab { background: var(--teal); color: #062a24; }
.sb-t .poss { width: 0; height: 0; border: 6px solid transparent; opacity: 0; }
.sb-t.you .poss { border-left-color: var(--legendary); } .sb-t.opp .poss { border-right-color: var(--legendary); }
.sb-t .poss.on { opacity: 1; }
.sb-m { background: #050816; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 0 10px; min-width: 64px; }
.sb-m .q { font: 700 11px var(--ui); color: var(--wood); letter-spacing: 1px; }
.sb-m .ck { font-size: 19px; line-height: 1; font-variant-numeric: tabular-nums; }
.sb-sc { background: var(--led); color: #1a0700; display: grid; place-items: center; min-width: 32px; font-size: 20px; }
.sb-sc.low { background: var(--bad); color: #fff; }
.sb-sc.off { background: #3a2a20; color: #3a2a20; }
.mtop { position: absolute; top: 8px; display: flex; gap: 6px; z-index: 6; }
.mtop.l { left: calc(8px + env(safe-area-inset-left, 0px)); } .mtop.r { right: calc(8px + env(safe-area-inset-right, 0px)); }
.mbtn { height: 36px; min-width: 36px; padding: 0 9px; border-radius: 10px; background: rgba(8,12,34,.8); border: 1px solid rgba(255,255,255,.12); font: 700 14px var(--ui); }
.cmds { position: absolute; top: 54px; bottom: 34px; display: flex; flex-direction: column; justify-content: center; gap: 6px; z-index: 6; }
.cmds.l { left: calc(6px + env(safe-area-inset-left, 0px)); } .cmds.r { right: calc(6px + env(safe-area-inset-right, 0px)); }
.cmd { position: relative; width: 70px; height: 44px; border-radius: 12px; background: rgba(10,14,40,.82); border: 1.5px solid rgba(46,230,197,.55); font: 700 12px/1 var(--ui); letter-spacing: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--cream); }
.cmd .c { font: 700 10px var(--ui); color: var(--legendary); }
.cmd.def { border-color: rgba(255,106,26,.6); }
.cmd.gold { border-color: var(--legendary); }
.cmd:disabled { opacity: .32; }

.energy { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; z-index: 6; font: 700 13px var(--ui); background: rgba(8,12,34,.8); padding: 4px 10px; border-radius: 999px; }

.callout { position: absolute; top: 22%; left: 0; right: 0; text-align: center; z-index: 7; pointer-events: none; font: 400 clamp(30px, 7vw, 56px)/1 var(--disp); letter-spacing: 1px; color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.6), 0 0 22px rgba(255,106,26,.6); opacity: 0; transform: scale(.7) skewX(-8deg); }

@keyframes callout { 0% { opacity: 0; transform: scale(.6) skewX(-8deg); } 15% { opacity: 1; transform: scale(1.06) skewX(-8deg); } 25% { transform: scale(1) skewX(-8deg); } 80% { opacity: 1; } 100% { opacity: 0; transform: scale(1.05) skewX(-8deg); } }
.ticker { position: absolute; bottom: 36px; left: 50%; transform: translateX(-50%); z-index: 6; font: 600 13px var(--ui); color: rgba(255,255,255,.85); background: rgba(0,0,0,.35); padding: 3px 10px; border-radius: 8px; white-space: nowrap; max-width: 70vw; overflow: hidden; text-overflow: ellipsis; }

.banner.show { opacity: 1; }
.pcardpop { position: absolute; z-index: 8; width: 168px; background: rgba(10,14,40,.94); border: 1px solid #34407e; border-radius: 12px; padding: 8px 10px; font: 600 13px var(--ui); pointer-events: none; }
.pcardpop b { font: 400 18px var(--disp); display: block; text-transform: uppercase; }
.pcardpop .g { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; margin-top: 4px; text-align: center; color: var(--mute); font-size: 11px; }
.pcardpop .g span { display: block; font: 400 16px var(--disp); color: var(--cream); }
.ov { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(4,6,20,.66); padding: 10px; animation: fadeIn .2s; }
.ovbox { background: linear-gradient(170deg, #1d2560, #10153a); border: 1px solid #34407e; border-radius: 20px; padding: 16px 18px; text-align: center; max-width: 560px; width: 100%; max-height: 100%; overflow: auto; }
.intro { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }

.tip { font: 600 14px var(--ui); color: var(--cream); margin-top: 12px; background: rgba(46,230,197,.1); border-radius: 10px; padding: 8px 10px; }
.clutch .kick { font: 700 14px var(--ui); letter-spacing: 4px; color: var(--led); }

.clutch .line { font: 600 16px var(--ui); color: var(--mute); }

@keyframes pulse2 { 50% { box-shadow: 0 0 4px rgba(255,194,61,.2); } }

.box { overflow-x: auto; }

@keyframes rot { 0%, 25% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }


/* results */

/* drag shot */

@keyframes dsFlashG { 20% { box-shadow: inset 0 0 160px rgba(70,230,120,.7); } }
.ds-cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.ds-top { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); left: 14px; right: 14px; pointer-events: none; }

.g-perfect { color: var(--good); text-shadow: 0 0 30px rgba(70,230,120,.8); } .g-great { color: var(--teal); } .g-good { color: var(--cream); } .g-off { color: var(--wood); } .g-brick { color: var(--bad); }

.row2 { display: flex; gap: 8px; align-items: center; }
.toggle { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.06); font: 700 16px var(--ui); }

/* ---------- next build: season, highlights ---------- */
.nav { grid-template-columns: repeat(4, 1fr); }

.lower { position: absolute; left: calc(14px + env(safe-area-inset-left, 0px)); bottom: 14px; z-index: 7; background: linear-gradient(90deg, rgba(10,14,40,.95), rgba(10,14,40,.7)); border-left: 4px solid var(--led); padding: 6px 14px 6px 10px; border-radius: 0 10px 10px 0; max-width: 70vw; }

.match.slowmo canvas { filter: saturate(1.25) contrast(1.05); }
@media (orientation: portrait) { .bracket { grid-template-columns: 1fr; } }
.clutch h1 { font-size: clamp(30px, 6.2vw, 58px); }
.clutch .who { font-size: 19px; }

.bracket { grid-template-columns: 1fr; }
.bround { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px; margin-bottom: 8px; }

}

.dr-k { font: 700 13px var(--ui); letter-spacing: 3px; color: #f6ce78; }

.dr-form { display: flex; flex-direction: column; gap: 8px; width: min(360px, 100%); }

.dcard { --rx: 0deg; --ry: 0deg; --sx: 50%; --sy: 30%; position: relative; border-radius: 18px; padding: 0; text-align: center; color: #fff7ea;
  background: linear-gradient(165deg, #3a3672, #1f1d43); border: 2px solid var(--rc, #9aa3bc);
  transform: rotateX(var(--rx)) rotateY(var(--ry)); transition: transform .12s ease-out, box-shadow .2s, opacity .2s, filter .2s;
  animation: deal .55s cubic-bezier(.2,1.3,.4,1) both; animation-delay: var(--d); box-shadow: 0 10px 24px rgba(10,5,30,.45); overflow: hidden; }

.dc-st { display: grid; grid-template-columns: 24px 1fr 18px; gap: 4px; align-items: center; font: 700 9.5px var(--ui); color: #c9c3e6; }

.dc-st b { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #7fe0c8, #c9fff2); }
.dc-st em { font-style: normal; color: #fff7ea; text-align: right; }
.dc-chem { margin-top: 6px; font: 700 10px var(--ui); color: #f6ce78; background: rgba(246,206,120,.12); border-radius: 8px; padding: 3px 4px; }
.dc-shine { position: absolute; inset: 0; background: radial-gradient(circle at var(--sx) var(--sy), rgba(255,255,255,.22), transparent 45%); pointer-events: none; }
.dc-stamp { position: absolute; left: 50%; top: 42%; z-index: 3; font: 800 22px 'Baloo 2', var(--disp); color: #7fe0c8; border: 3px solid #7fe0c8; border-radius: 10px; padding: 0 10px; transform: translate(-50%, -50%) rotate(-14deg) scale(2.2); opacity: 0; pointer-events: none; background: rgba(20,30,40,.55); }
.dcard.signed .dc-stamp { animation: stamp .45s cubic-bezier(.2,1.5,.4,1) forwards; }
@keyframes stamp { to { opacity: 1; transform: translate(-50%, -50%) rotate(-14deg) scale(1); } }
.dcard.big .dc-face { width: 120px; } .dcard.big .dc-name { font-size: 20px; } .dcard.big .dc-st { font-size: 11px; }
.dr-five { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; width: min(560px, 100%); }
.dr-mini { border-radius: 14px; border: 2px solid var(--rc); background: linear-gradient(165deg, #3a3672, #1f1d43); padding: 4px 2px 6px; display: flex; flex-direction: column; align-items: center; animation: deal .5s both; animation-delay: var(--d); }
.dr-mini span { font: 700 10px var(--ui); color: #f6ce78; } .dr-mini svg { width: 100%; max-width: 60px; height: auto; }
.dr-mini b { font: 800 20px/1 'Baloo 2', var(--disp); } .dr-mini em { font: 700 11px var(--ui); font-style: normal; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dr-meta { display: flex; gap: 8px; } .dr-meta div { background: rgba(255,255,255,.07); border-radius: 12px; padding: 6px 12px; font: 600 12px var(--ui); color: #c9c3e6; }
.dr-meta b { display: block; font: 800 22px 'Baloo 2', var(--disp); color: #fff7ea; }
.help p { font: 600 15px/1.45 var(--ui); color: #d6d1f0; margin: 0 0 10px; } .help b { color: #fff7ea; }
@media (orientation: landscape) and (max-height: 520px) { .dr-wrap { gap: 6px; padding-top: 8px; } .dc-face { width: 58px; } .dr-p { font-size: 13px; } .dr-h { font-size: 22px; } }
@media (prefers-reduced-motion: reduce) { .dcard, .dr-mini { animation: none; } }

.dc-top { flex-direction: column; align-items: flex-start; gap: 0; }
.dc-pos { margin-top: 1px; }
.dr-wrap { justify-content: center; }
@media (orientation: landscape) and (max-height: 520px) {
  .dr-wrap { justify-content: flex-start; gap: 4px; padding-top: 6px; }
  .dr-wrap.welcome { justify-content: center; }
  .dr-slot { width: 42px; } .dr-slot svg { width: 24px; height: auto; } .dr-slot b { line-height: 24px; font-size: 14px; }
  .dr-cards { width: min(600px, 100%); } .dcard .dc-in { padding: 5px 7px 6px; }
  .dcard .dc-face { width: 46px; } .dc-arch { margin: 0 0 2px; } .dc-name { min-height: 0; font-size: 14px; }

}

/* ---------- build 6: legends ---------- */
.legendcard { --rc: #d9b3ff; background: linear-gradient(160deg, #4a2f78, #1e1440 60%, #3a2a10) !important; border-color: #f6ce78 !important; box-shadow: 0 0 18px rgba(246,206,120,.35), inset 0 0 20px rgba(217,179,255,.15); }
.row.legendcard { border-left-color: #f6ce78; }
.tag.leg { background: linear-gradient(90deg, #f6ce78, #d9b3ff); color: #2a1a40; }
.pack.legend { border-color: #f6ce78; background: linear-gradient(170deg, #4a2f78, #22163f); grid-column: 1 / -1; }
.reveal .legendcard .rar { color: #f6ce78; }

/* instant replay */
.irwrap { position: absolute; inset: 0; z-index: 15; cursor: pointer; animation: fadeIn .25s; }
.irwrap::before, .irwrap::after { content: ''; position: absolute; left: 0; right: 0; height: 11%; background: #0b0a18; animation: bars .35s ease-out; }
.irwrap::before { top: 0; } .irwrap::after { bottom: 0; }
@keyframes bars { from { height: 0; } }
.irtag { position: absolute; top: calc(11% + 10px); left: 14px; z-index: 2; font: 800 14px 'Baloo 2', var(--ui); letter-spacing: 2px; color: #3a2a10; background: #f6ce78; padding: 4px 12px; border-radius: 10px; }
.irlow { position: absolute; bottom: calc(11% + 12px); left: 14px; z-index: 2; background: rgba(30,24,50,.88); border-left: 4px solid #7fe0c8; border-radius: 0 12px 12px 0; padding: 6px 14px 6px 10px; }
.irlow b { display: block; font: 800 20px 'Baloo 2', var(--disp); text-transform: uppercase; color: #fff7ea; }
.irlow span { font: 700 13px var(--ui); color: #7fe0c8; letter-spacing: 1px; }
.irskip { position: absolute; bottom: calc(11% + 16px); right: 14px; z-index: 2; font: 600 12px var(--ui); color: rgba(255,255,255,.6); }

    doSubs(ti, exclude) {
      const T = this.teams[ti]; if (!T.bench.length) return;
      const O = this.teams[1 - ti];
      for (let i = 0; i < 5; i++) {
        const p = T.on[i]; if (p === exclude) continue;
        let best = null, bs = -1;
        const want = BK.POSITIONS[i];
        for (const bn of T.bench) {
          if (bn.fouledOut) continue;
          const fit = bn.pos.includes(want) ? 2 : bn.pos.some((q) => Math.abs(BK.POSITIONS.indexOf(q) - i) === 1) ? 1 : 0;
          const s = fit * 10 + bn.ovr * 0.3 + bn.energy * 8;
          if (s > bs) { bs = s; best = bn; }
        }
        if (!best) continue;
        const tired = p.fouledOut || (p.energy < 0.6 && best.energy > 0.78 && best.energy - p.energy > 0.25);
        const starterBack = best.starter && !p.starter && best.energy > 0.92 && p.energy < 0.8;
        if (!tired && !starterBack) continue;
        const bi = T.bench.indexOf(best);
        T.on[i] = best; T.bench[bi] = p;
        best.on = true; best.slot = i; p.on = false;
        best.x = p.x; best.y = p.y; best.vx = best.vy = 0; best.tx = p.tx; best.ty = p.ty; best.task = null; best.spot = this.formSpot(best);
        best.assign = p.assign;
        for (const d of O.on) if (d.assign === p) d.assign = best;
        if (this.ball.holder === p) this.ball.holder = best;
        if (this.inb && this.inb.p === p) this.inb.p = best;
        if (this.inb && this.inb.r === p) this.inb.r = best;
        this.counts.subs++;
        this.emit('sub', { team: ti, pin: best, pout: p });
      }
      this.cp = this.teams[0].on.concat(this.teams[1].on);
    }

    // ---------- quarters ----------
    endQuarter() {
      if (this.phase === 'break' || this.over) return;
      this.resolveStand();
      this.emit('buzzer', { q: this.q });
      this.clockOn = false; this.clock = 0;
      if (this.q >= 4 && this.diff() !== 0) return this.finish();
      this.phase = 'break'; this.phaseT = 0;
      this.breakT = this.q === 2 && !this.cfg.auto ? 1e9 : 2.8;
      this.ball.state = 'dead';
      this.emit('quarterEnd', { q: this.q, half: this.q === 2 });
    }
    continueBreak() { if (this.phase === 'break') this.breakT = 0; }
    nextQuarter() {
      this.q++;
      this.clock = this.q > 4 ? OT_LEN : Q_LEN; this.shot = SC;
      this.teams.forEach((T) => { T.fouls = 0; T.roster.forEach((p) => (p.energy = Math.min(1, p.energy + (this.q === 3 ? 0.35 : 0.18)))); });
      this.run = { team: -1, pts: 0 };
      const team = this.q === 2 || this.q === 3 ? 1 - this.tipWinner : this.q === 4 ? this.tipWinner : Math.random() < 0.5 ? 0 : 1;
      this.emit('quarterStart', { q: this.q });
      this.startInbound(team, 'side');
    }
    finish() {
      this.resolveStand();
      this.over = true; this.phase = 'over'; this.clockOn = false;
      this.emit('end', { winner: this.diff() > 0 ? 0 : 1 });
    }

    // ---------- coach commands (team 0 = user) ----------
    command(name, team = 0) {
      const co = this.coach[team], b = this.ball, h = this.holder();
      const live = this.phase === 'live' && !this.over && !this.paused;
      const myBall = live && this.poss === team && (b.state === 'held' || b.state === 'pass');
      switch (name) {
        case 'pass': if (!myBall) return { ok: false, why: 'Use on offence' }; co.pass = 7; if (h) h.decideT = Math.min(h.decideT, 0.1); break;
        case 'shoot': {
          if (!myBall) return { ok: false, why: 'Use on offence' };
          if (h && this.off.crossed && D2(h, hoopOf(team)) < 29 && b.state === 'held') { this.requestDragShot(h, 'COACH CALL'); return { ok: true, drag: true }; }
          co.shoot = 4; break;
        }
        case 'drive': if (!myBall || !h) return { ok: false, why: 'Need the ball' }; co.drive = 3; h.driving = 1.8; h.boost = Math.max(h.boost, 0.06); h.dwell = 0; h.driveSide = this.lpos(h).y < 25 ? -1 : 1; this.emit('drive', { p: h }); break;
        case 'lockdown': if (!(live && this.poss !== team)) return { ok: false, why: 'Use on defence' }; co.lockdown = 10; break;
        case 'fastbreak': co.fastbreak = 10; if (this.off && this.poss === team && !this.off.crossed) this.off.transition = true; break;
        case 'clutch': co.clutch = 15; break;
        case 'timeout': {
          if (this.teams[team].timeouts <= 0) return { ok: false, why: 'No timeouts left' };
          if (this.phase === 'break' || this.over) return { ok: false, why: 'Not now' };
          if (live && this.poss === team && b.state === 'held') { this.doTimeout(team, () => this.startInbound(team, 'front')); return { ok: true }; }
          this.toQueued[team] = true; return { ok: true, queued: true };
        }
        default: return { ok: false };
      }
      this.emit('command', { name, team });
      return { ok: true };
    }

    // ---------- clutch / drag shot ----------
    checkClutch(h) {
      if (h.t !== 0 || this.pending || !this.cfg.interactive && !this.cfg.auto) return;
      const off = this.off;
      if (!off || !off.crossed || off.clutchDone || h.dwell > 0 || h.driving > 0 || this.ball.state !== 'held') return;
      const H = hoopOf(0), dist = D2(h, H);
      if (dist > 30) return;
      const diff = this.diff();
      const cool = this.t - this.clutch.lastT > 34 && this.clutch.count < 5;
      let reason = null;
      if (this.cfg.tutorial && !this.clutch.tut && this.poss === 0 && h.slot === 0 && this.t > 5 && ((off.setT > 1.4 && this.isThree(0, h.x, h.y) && dist < 27) || off.setT > 4)) {
        this.clutch.tut = true; const d = this.defenderOf(h); if (d) d.screened = 3;
        reason = this.isThree(0, h.x, h.y) ? 'OPEN THREE' : 'OPEN LOOK';
      } else if (cool && !(this.cfg.tutorial && !this.clutch.tut)) {
        const boost = this.clutch.count === 0 && this.q >= 2 ? 2 : 1;
        const cont = this.contest(h);
        if (this.q >= 4 && this.clock <= 13 && Math.abs(diff) <= 3 && !off.rolled.final) { off.rolled.final = true; reason = diff < 0 ? 'DOWN ' + -diff + ' — LAST SHOT' : diff === 0 ? 'TIED — FINAL POSSESSION' : 'ICE IT'; }
        else if (this.q >= 4 && this.clock <= 40 && Math.abs(diff) <= 5 && !this.clutch.crunch) { this.clutch.crunch = true; reason = 'CRUNCH TIME'; }
        else if (!off.rolled.open && cont.d > 7 && this.isThree(0, h.x, h.y)) { off.rolled.open = true; if (Math.random() < 0.3 * boost) reason = 'WIDE OPEN THREE'; }
        else if (h.streak >= 3 && !off.rolled.hot) { off.rolled.hot = true; if (Math.random() < 0.4) reason = 'HEAT CHECK'; }
        else if (!off.rolled.mm) { off.rolled.mm = true; const dd = this.defenderOf(h); if (dd && h.ovr - dd.ovr >= 8 && Math.random() < 0.2 * boost) reason = 'MISMATCH ON ' + dd.last.toUpperCase(); }
      }
      if (reason) { off.clutchDone = true; this.requestClutch(h, reason, this.cfg.tutorial && this.clutch.tut && !this.clutch.tutShown); }
    }
    checkDefClutch(h) {
      if (this.pending || (!this.cfg.interactive && !this.cfg.auto)) return;
      const off = this.off; if (!off || !off.crossed || off.defDone || this.ball.state !== 'held' || this.clutch.count >= 6) return;
      const diff = this.diff();
      let reason = null;
      if (this.q >= 4 && this.clock <= 13 && diff >= -2 && diff <= 3) reason = diff > 0 ? 'PROTECT THE LEAD' : diff === 0 ? 'TIED — GET A STOP' : 'NEED A STOP';
      else if (this.q >= 4 && this.clock <= 45 && Math.abs(diff) <= 4 && !this.clutch.dcrunch) { this.clutch.dcrunch = true; reason = 'DEFENSIVE STAND'; }
      if (reason) { off.defDone = true; this.requestDefClutch(h, reason); }
    }
    requestDefClutch(h, reason) {
      this.paused = true; this.pending = { type: 'dclutch', h, reason };
      this.clutch.count++; this.clutch.lastT = this.t;
      const d = this.defenderOf(h);
      this.emit('defClutch', { h, reason, def: d });
      if (this.cfg.auto) this.resolveDefClutch(BK.pick(['double', 'lock', 'gamble']));
    }
    resolveDefClutch(choice) {
      const pend = this.pending; if (!pend || pend.type !== 'dclutch') return;
      const h = pend.h; this.pending = null; this.paused = false;
      this.stand = { opp: this.teams[1].score, active: true, choice };
      const D = this.teams[0], d = this.defenderOf(h) || D.on[0];
      if (choice === 'double') {
        let help = null, bd = 1e9; for (const q of D.on) { if (q === d) continue; const dd = D2(q, h); if (dd < bd) { bd = dd; help = q; } }
        if (help) { help.double = h; help.doubleUntil = this.t + 4.5; }
        this.coach[0].lockdown = Math.max(this.coach[0].lockdown, 3);
        h.decideT = 0.25;
        this.emit('defCall', { choice, d: help, h });
      } else if (choice === 'lock') {
        this.coach[0].lockdown = Math.max(this.coach[0].lockdown, 10); h.boost -= 0.06;
        this.emit('defCall', { choice, d, h });
      } else {
        const ch = clamp(0.12 + d.a.steal / 450 + (d.a.perimeterD - 70) / 600, 0.08, 0.45);
        if (Math.random() < ch) {
          d.st.stl++; h.st.tov++; this.counts.steals++; this.counts.tov++;
          d.x = lerp(d.x, h.x, 0.7); d.y = lerp(d.y, h.y, 0.7);
          this.giveBall(d); this.startPossession(0, 'steal'); d.dwell = 0.15;
          this.emit('steal', { p: d, from: h, gamble: true });
        } else {
          d.screened = 1.6; h.driving = 1.8; h.boost += 0.1; h.dwell = 0; h.driveSide = this.lpos(h).y < 25 ? -1 : 1;

        }
      }
    }
    resolveStand() {
      const s = this.stand; if (!s || !s.active) return;
      s.active = false; this.stand = null;
      if (this.teams[1].score === s.opp) { this.clutch.won++; this.emit('defStop', { choice: s.choice }); }
    }
    requestClutch(h, reason, tut) {
      if (tut) this.clutch.tutShown = true;
      this.paused = true; this.pending = { type: 'clutch', h, reason };
      this.clutch.count++; this.clutch.lastT = this.t;
      this.emit('clutch', { h, reason, tutorial: !!tut });
      if (this.cfg.auto) this.resolveClutch(BK.pick(['shoot', 'drive', 'pass']));
    }
    resolveClutch(choice) {
      const pend = this.pending; if (!pend || pend.type !== 'clutch') return;
      const h = pend.h; this.pending = null; this.paused = false;
      this.clutch.active = { t: this.t };
      if (choice === 'shoot') return this.requestDragShot(h, pend.reason);
      if (choice === 'drive') { h.driving = 2.0; h.dwell = 0; h.boost = 0.12; h.driveSide = this.lpos(h).y < 25 ? -1 : 1; this.emit('drive', { p: h, clutch: true }); return; }
      // pass: best open teammate
      const O = this.teams[h.t]; let best = null, bv = -1;
      for (const m of O.on) { if (m === h) continue; const c = this.contest(m); const v = this.shotProb(m, m.x, m.y, c) * (this.isThree(m.t, m.x, m.y) ? 3 : 2) * (1 - this.passRisk(h, m)); if (v > bv) { bv = v; best = m; } }
      if (best) { best.boost = 0.1; best.decideT = 0; this.pass(h, best, { safe: true }); this.emit('clutchPass', { from: h, to: best }); }
    }
    requestDragShot(h, reason) {
      const cont = this.contest(h);
      const prob = clamp(this.shotProb(h, h.x, h.y, cont) + h.boost, 0.02, 0.96);
      const H = hoopOf(h.t), dist = D2(h, H), pts = this.isThree(h.t, h.x, h.y) ? 3 : 2;
      this.paused = true; this.pending = { type: 'drag', h, prob, reason };
      this.emit('dragShot', { h, dist, pts, prob, contest: cont.d, defender: cont.def, reason });
      if (this.cfg.auto) this.resolveDragShot({ grade: BK.pick(['perfect', 'great', 'good', 'off', 'brick']) });
    }
    resolveDragShot(res) {
      const pend = this.pending; if (!pend || pend.type !== 'drag') return;
      this.pending = null; this.paused = false;
      const g = res.grade;
      if (this.ball.holder !== pend.h || this.ball.state !== 'held') return;
      if (res.made != null) this.shoot(pend.h, { prob: res.made ? 1 : 0, force: true, manual: true, grade: g });
      else this.shoot(pend.h, { prob: BK.gradeProb(pend.prob, g), manual: true, grade: g });
    }

    // ---------- main loop ----------
    update(realDt) {
      if (this.over) return;
      let t = Math.min(realDt, 0.1) * this.speed * TIME_SCALE;
      const saved = Math.random; if (this.rng) Math.random = this.rng;
      try { while (t > 1e-6 && !this.paused && !this.over) { const dt = Math.min(t, 1 / 60); t -= dt; this.step(dt); } }
      finally { Math.random = saved; }
    }
    step(dt) {
      this.t += dt; this.phaseT += dt;
      for (const co of this.coach) for (const k in co) if (co[k] > 0) co[k] -= dt;
      switch (this.phase) {
        case 'tip': this.tipStep(dt); break;
        case 'live': this.liveStep(dt); break;
        case 'inbound': this.inboundStep(dt); this.defenseStep(dt); break;
        case 'ft': this.ftStep(dt); break;
        case 'dead': this.deadT -= dt; for (const p of this.cp) p.mode = Math.min(p.mode, 0.5); if (this.deadT <= 0) { const fn = this.deadFn; this.deadFn = null; if (fn) fn(); } break;
        case 'break': this.breakT -= dt; if (this.breakT <= 0) this.nextQuarter(); break;
      }
      this.movePlayers(dt);
      this.ballStep(dt);
      for (const T of this.teams) {
        for (const p of T.on) { p.energy = Math.max(0.25, p.energy - dt * 0.0027 * (1.6 - p.a.stamina / 99) * (0.6 + 0.6 * p.mode)); if (this.clockOn) p.st.sec += dt; }
        for (const p of T.bench) p.energy = Math.min(1, p.energy + dt * 0.012);
      }
    }
    liveStep(dt) {
      const b = this.ball;
      if (this.clockOn) {
        this.clock -= dt;
        if (b.state === 'held' || b.state === 'pass') this.shot -= dt;
        if (this.clock <= 0) { this.clock = 0; this.clockOn = false; }
      }
      if (this.clock <= 0 && !this.clockOn && this.phase === 'live' && this.q >= 1 && this.t > 3) {
        if (b.state !== 'shot' && b.state !== 'gather' && !(b.state === 'pass' && b.f && b.f.inbound)) { this.endQuarter(); return; }
      }
      if (this.clockOn && this.shot <= 0 && this.clock > 0 && (b.state === 'held' || b.state === 'pass')) {
        const h = b.holder || (b.f && b.f.to);
        if (h) h.st.tov++;
        this.counts.tov++;
        this.emit('turnover', { p: h, kind: 'SHOT CLOCK' }); this.emit('whistle');
        b.state = 'dead';
        this.deadBall(1.0, () => this.startInbound(1 - this.poss, 'side'));
        return;
      }
      if (b.state === 'loose') { this.looseAI(); return; }
      if (b.state === 'gather') { this.gatherStep(dt); this.defenseStep(dt); return; }
      this.offenseStep(dt);
      this.defenseStep(dt);
      const h = this.holder();
      if (h && h.t === this.poss && this.phase === 'live' && !this.paused) { if (h.t === 0) this.checkClutch(h); else this.checkDefClutch(h); }
    }

    offenseStep(dt) {
      const off = this.off; if (!off) return;
      const O = this.teams[this.poss], b = this.ball;
      const h = b.state === 'held' && b.holder && b.holder.t === this.poss ? b.holder : null;
      off.setT += dt;
      if (b.state === 'shot') { this.shotFlightAI(O); return; }
      if (h && !off.crossed) { const l = this.lpos(h); if (l.x < 55) { off.crossed = true; this.chooseSet(h); } }
      for (const p of O.on) { if (p === h) this.handlerMove(p, dt); else this.offBall(p, dt); }
      if (h && this.phase === 'live') this.decide(h, dt);
      if (off.crossed && h) {
        // motion scheduler (off-ball action)
        if (off.set !== 'iso') {
          off.nextMove -= dt;
          if (off.nextMove <= 0) { off.nextMove = rr(1.1, 2.1); this.motionAction(O, h); }
        }
        this.spaceT -= dt;
        if (this.spaceT <= 0) {
          this.spaceT = 0.7;
          for (const p of O.on) {
            if (p === h || p.task) continue;
            const crowd = O.on.some((q) => q !== p && D2(q, p) < 7.5);
            if (crowd) p.task = { type: 'relocate', to: this.freeSpot(p, p.a.threePoint >= 66 ? PERIM : INSIDE.concat(PERIM.slice(3))), mode: 0.8 };
          }
        }
      }
    }
    shotFlightAI(O) {
      const H = hoopOf(this.poss);
      for (const p of O.on) {
        const crash = p.tend.crashFrequency > 55 || (D2(p, H) < 14 && Math.random() < 0.02) || p.slot >= 3;
        if (crash) this.setLT(p, p.slot === 4 ? rr(4, 6.5) : rr(5, 9), 25 + (p.slot % 2 ? 4 : -4), 1);
        else this.setLT(p, 42, clamp(this.lpos(p).y, 12, 38), 0.7);
      }
      const D = this.teams[1 - this.poss];
      for (const d of D.on) { const m = d.assign || O.on[d.slot]; const u = unit(H.x - m.x, H.y - m.y); d.tx = m.x + u.x * 2.2; d.ty = m.y + u.y * 2.2; d.mode = 0.9; }
    }
    chooseSet(h) {
      const O = this.teams[this.poss], off = this.off;
      const bigs = O.on.filter((p) => p !== h && p.slot >= 3);
      const post = O.on.filter((p) => p !== h && p.tend.postFrequency >= 60).sort((a, b) => b.tend.postFrequency - a.tend.postFrequency)[0];
      const opts = [
        { k: 'pnr', w: bigs.length ? 1.0 + (h.a.handles + h.a.passing) / 250 : 0 },
        { k: 'motion', w: 0.8 + O.on.reduce((s, p) => s + p.a.passing, 0) / 5 / 160 },
        { k: 'post', w: post ? post.tend.postFrequency / (post.tr.pointCenter ? 50 : 70) : 0 },
        { k: 'iso', w: (h.tend.isoFrequency / 80) * (h.ovr >= 86 ? 1.4 : 0.5) },
      ];
      let pick = BK.wsum(opts, (o) => o.w).k;
      if (this.cfg.tutorial && this.poss === 0 && !this.tutSet && bigs.length) { pick = 'pnr'; this.tutSet = true; }
      if (off.transition && this.lpos(h).x < 30) pick = 'motion';
      off.set = pick; off.setT = 0;
      if (pick === 'pnr') {
        const scr = bigs.sort((a, b) => b.slot - a.slot)[0];
        off.screener = scr;
        scr.task = { type: 'screen', target: this.defenderOf(h), forP: h, next: scr.a.threePoint >= 74 && Math.random() < 0.6 ? 'pop' : 'roll', hold: 0, t: 0 };
        if (this.cfg.tutorial && this.tutSet && this.poss === 0) scr.task.next = 'roll';
      } else if (pick === 'post' && post) {
        off.post = post;

      } else if (pick === 'iso') {
        for (const p of O.on) {
          if (p === h) continue;

          p.task = { type: 'relocate', to: this.freeSpot(p, p.a.threePoint >= 66 ? far : INSIDE.slice(0, 2)), mode: 0.8 };
        }
      }

    }
    motionAction(O, h) {
      const cands = O.on.filter((p) => p !== h && !p.task);
      if (!cands.length) return;
      const p = BK.wsum(cands, (q) => (q.slot === 1 || q.slot === 2 ? 2 : 1) * (q.tr.relocator ? 2.6 : 1) * (q.slot === 4 ? 0.35 : 1));
      const r = Math.random(), l = this.lpos(p), side = l.y < 25 ? -1 : 1;
      if (r < 0.3 && p.a.speed > 55) p.task = { type: 'cut', side };
      else if (r < 0.72 || p.slot >= 3) p.task = { type: 'relocate', to: this.freeSpot(p, p.a.threePoint >= 66 ? PERIM : INSIDE), mode: 0.9 };
      else {
        const big = O.on.find((q) => q !== h && q !== p && q.slot >= 3 && !q.task);
        const dp = this.defenderOf(p);
        if (big && dp) {
          big.task = { type: 'screen', target: dp, forP: p, next: 'stay', hold: 0, t: 0 };
          p.task = { type: 'delay', dur: 0.9, then: { type: 'relocate', to: this.freeSpot(p, CURL), mode: 1 } };
        } else p.task = { type: 'relocate', to: this.freeSpot(p, PERIM), mode: 0.9 };
      }
    }
    handlerMove(p, dt) {
      const off = this.off, H = hoopOf(p.t);

        this.setLT(p, 5.2, 25 + p.driveSide * 1.2, 1);

      }
      const l = this.lpos(p);
      if (!off.crossed) { this.setLT(p, off.transition ? 18 : 27, clamp(l.y, 11, 39), 1.1); return; }
      if (p.post) { this.setLT(p, Math.max(l.x - 1.2, 6), lerp(l.y, 25, 0.08), 0.3); return; }
      const scr = off.screener;

        const n = this.screenNormal(p);
        const sl = this.lpos(scr);
        const tut = this.cfg.tutorial && this.poss === 0;
        const w = loc(p.t, tut ? Math.max(26.5, sl.x - 3.5) : sl.x - 3.5, sl.y);
        p.tx = w.x + n.x * 3; p.ty = w.y + n.y * 3; p.mode = 0.95;
        if (D2(p, scr) < 3.2) {

    filterPlayers() {
      const f = this.pf, S = G().S, q = BK.normName(f.q || '');
      const key = { ovr: (r) => BK.displayOvr(r), three: (r) => r.attributes.threePoint, scoring: (r) => BK.scoring(r.attributes), defence: (r) => BK.defence(r.attributes), passing: (r) => r.attributes.passing, reb: (r) => r.attributes.rebounding };

    drawRows(force) {

      if (!force && this._rng && this._rng[0] === a && this._rng[1] === b) return;

      const g = G(), f = this.pf;

      let html = '';
      if (!this.rows.length) html = `<p class="small-note" style="padding:20px">No players match. Clear the search or filters.</p>`;
      for (let i = a; i < b; i++) {
        const r = this.rows[i], st = g.status(r.id), t = BK.team(r.team);

      }
      $('#vi').innerHTML = html;
    },

    // ---------- SETTINGS ----------
    settings() {
      const S = G().S;
      const m = this.modal(`<h3>Settings</h3>
        <div class="toggle">Sound<button class="btn" data-t="sound">${S.settings.sound ? 'ON' : 'OFF'}</button></div>

        <div class="toggle">Coach name<input id="cn" maxlength="16" value="${esc(S.userName || '')}" placeholder="Optional" style="width:55%"></div>
        <div class="toggle">Team name<input id="tn" maxlength="18" value="${esc(S.teamName)}" style="width:55%"></div>

        <p class="small-note">Drop in a JSON or CSV with columns like name, team, position, overall2K, threePoint, passing… (2K-style headers such as “Three-Point Shot” also work). Matching players are updated; new names are added. Ratings you import are labelled IMPORTED.</p>
        <div class="acts"><label class="btn pri" style="text-align:center">Import JSON / CSV<input type="file" id="imp" accept=".json,.csv,.txt,application/json,text/csv" hidden></label><button class="btn" data-resetdata>Restore built-in data</button></div>
        <div class="sec">Testing</div>
        <div class="acts"><button class="btn" data-afk8>Simulate 8h away</button><button class="btn" data-reset style="color:#ff9a9a">Reset save</button></div>`);
      m.addEventListener('click', (e) => {
        const t = e.target.closest('[data-t]');
        if (t) {
          const k = t.dataset.t;
          if (k === 'speed') { S.settings.speed = S.settings.speed === 1 ? 2 : 1; t.textContent = S.settings.speed + '×'; }
          else if (k === 'replays') { S.settings.replays = S.settings.replays === false; t.textContent = S.settings.replays ? 'ON' : 'OFF'; }
          else if (k === 'haptics') { S.haptics = S.haptics === false; t.textContent = S.haptics ? 'ON' : 'OFF'; BK.buzz(20); }
          else { S.settings[k] = !S.settings[k]; t.textContent = S.settings[k] ? 'ON' : 'OFF'; BK.Audio.init(); k === 'sound' ? BK.Audio.setSound(S.settings.sound) : BK.Audio.setMusic(S.settings.music); }
          G().save(); snd('tap');
        }
        if (e.target.closest('[data-afk8]')) { S.afk.last = Date.now() - 8 * 3600e3 - 1000; G().save(); m.remove(); this.welcomeBack(true); }
        if (e.target.closest('[data-reset]')) { if (R.confirm('Erase all progress?')) { G().reset(); m.remove(); this.show('home'); this.toast('Save reset'); } }
        if (e.target.closest('[data-resetdata]')) { G().clearImport(); BK.DB.load(R.BUCKETS_PLAYERS); G().load(); this.toast('Built-in roster restored'); m.remove(); this.refresh(); }
      });
      $('#cn', m).addEventListener('change', (e) => { S.userName = (e.target.value || '').trim().slice(0, 16); G().save(); });
      m.querySelector('[data-help]').addEventListener('click', () => { m.remove(); this.help(); });
      $('#tn', m).addEventListener('change', (e) => { S.teamName = (e.target.value || 'MY SQUAD').toUpperCase().slice(0, 18); G().save(); this.refresh(); });
      $('#imp', m).addEventListener('change', async (e) => {
        const f = e.target.files[0]; if (!f) return;
        try {
          const raws = BK.parseImport(await f.text());
          const res = BK.mergeImport(BK.DB.list, raws);
          BK.DB.load(res.list); G().saveImport(res.list);
          this.toast(`Imported: ${res.updated} updated · ${res.added} added${res.skipped ? ' · ' + res.skipped + ' skipped' : ''}`, 3500); m.remove(); this.refresh();
        } catch (err) { this.toast('Import failed: ' + err.message, 4000); }
      });
    },

    // ---------- AFK WELCOME BACK ----------
    welcomeBack(force) {
      const g = G(), P = g.afkPending();
      if (!force && P.ms < 5 * 60 * 1000) return false;
      const games = Math.max(1, P.games);
      const h = Math.floor(P.hours), mm = Math.round((P.hours - h) * 60);
      const m = this.modal(`<div class="wb"><h3>Welcome back</h3><div class="games">You were away ${h}h ${mm}m${P.capped ? ' (8h cap)' : ''} · your team played <b>${games}</b> simulated games</div>
        <div class="big"><div><b>🏆 +${BK.fmt(P.buckets)}</b>Buckets</div><div><b>🪙 +${BK.fmt(P.coins)}</b>Coins</div><div><b>⭐ +${BK.fmt(P.xp)}</b>Team XP</div><div><b>🔥 +${BK.fmt(P.pxp)}</b>Player XP each</div></div>
        <div class="acts"><button class="btn pri" data-c1>Collect</button><button class="btn gold" data-c2>📺 2× rewards</button></div>
        <div class="acts"><button class="btn" data-c3>🎬 Collect & watch highlights</button></div></div>`);
      const go = async (mult) => {
        if (mult > 1) await this.fakeAd();
        const res = g.claimAfk(mult); m.remove(); snd('reward');
        this.toast(`${res.wins}-${res.games.length - res.wins} while away · ${res.ups.length ? res.ups.length + ' players levelled up!' : 'collected!'}`, 3000);
        if (res.ups.length) snd('levelup');
        this.refresh();
      };
      m.querySelector('[data-c1]').addEventListener('click', () => go(1));
      m.querySelector('[data-c2]').addEventListener('click', () => go(2));
      m.querySelector('[data-c3]').addEventListener('click', async () => { await go(1); BK.MatchUI.startReplay(); });
      return true;
    },
    fakeAd() {
      return new Promise((res) => {
        const a = document.createElement('div'); a.className = 'ad'; let n = 3;
        a.innerHTML = `<div>Rewarded ad placeholder<b>${n}</b><small style="color:#8e95b8">No real ads in this prototype — SDK hooks go here</small></div>`;
        document.body.appendChild(a);
        const iv = setInterval(() => { n--; if (n <= 0) { clearInterval(iv); a.remove(); res(true); } else a.querySelector('b').textContent = n; }, 1000);
      });
    },
    refresh() { const id = this.stack[this.stack.length - 1]; if (this['render_' + id]) this['render_' + id](); },

    bind() {
      document.addEventListener('click', async (e) => {
        const t = e.target;
        if (t.closest('[data-back]')) return this.back();
        const go = t.closest('[data-go]'); if (go) { snd('tap'); return this.show(go.dataset.go); }
        const pr = t.closest('[data-prof]'); if (pr) { snd('tap'); return this.profile(pr.dataset.prof); }
        const sl = t.closest('[data-slot]'); if (sl) { snd('tap'); return this.pickFor(+sl.dataset.slot); }
        const act = t.closest('[data-act]');
        if (act) {
          const a = act.dataset.act; snd('tap');
          if (a === 'play') { if (!G().seasonNext()) { this.show('season'); return this.toast('Season over — claim rewards & start the next one'); } return BK.MatchUI.start(); }
          if (a === 'hl') return BK.MatchUI.startReplay();
          if (a === 'settings') return this.settings();
          if (a === 'afk') { if (!this.welcomeBack(true)) { } return; }
        }
        const fac = t.closest('[data-fac]'); if (fac) { const r = G().upgradeFac(fac.dataset.fac); if (r.ok) { snd('levelup'); this.toast('Upgraded!'); } else { snd('deny'); this.toast(r.why); } return this.refresh(); }
        const pup = t.closest('[data-pup]'); if (pup) { const r = G().upgrade(pup.dataset.pup); if (r.ok) snd('levelup'); else { snd('deny'); this.toast(r.why); } return this.refresh(); }
        if (t.closest('[data-track]')) { const r = G().claimTrack(); if (r) { snd('reward'); this.toast('Day reward claimed!'); if (r.pull) this.reveal(r.pull); } return this.refresh(); }
        const ch = t.closest('[data-ch]'); if (ch) { const r = G().claimChallenge(+ch.dataset.ch); if (r) { snd('reward'); this.toast('Challenge reward: ' + (r.coins ? '🪙 ' + r.coins : '⚡ ' + r.hype)); } return this.refresh(); }
        if (t.closest('[data-adch]')) { await this.fakeAd(); G().addExtraChallenge(); this.toast('Extra challenge unlocked'); return this.refresh(); }
        if (t.closest('[data-sclaim]')) { const r = G().claimSeason(); if (r) { snd('reward'); this.toast(`Season rewards: 🪙${BK.fmt(r.rw.coins)} ⚡${r.rw.hype}`); if (r.pull) this.reveal(r.pull); } BK.UI.stack = ['home', 'season']; return this.show('season', false); }
        if (t.closest('[data-snew]')) { const n = G().S.season.n + 1; G().newSeason(n); snd('levelup'); this.toast('Season ' + n + ' — the league got tougher'); return this.refresh(); }
        const pk = t.closest('[data-pack]'); if (pk) { const r = G().buyPack(pk.dataset.pack); if (r) this.reveal(r); else { snd('deny'); this.toast('Not enough currency'); } return this.refresh(); }
        if (t.closest('[data-giftpack]')) { const r = G().buyPack('legend', 'gift'); if (r) this.reveal(r); return this.refresh(); }

        ${r.drop === 'ticket' ? `<p class="small-note" style="text-align:center;color:var(--teal)">🎟 Free Scout Ticket earned — open it in Scout</p>` : ''}
        <div class="acts"><button class="btn gold" data-x2 ${this.adUsed ? 'disabled' : ''}>📺 Double rewards</button><button class="btn" data-share>Share card</button></div>
        <div class="sec">Top performers <small>${this.perfects} perfect release${this.perfects === 1 ? '' : 's'} · ${sum.clutch.won}/${sum.clutch.count} clutch moments won</small></div>
        <div class="list">${tops.map((p) => `<div class="item">${BK.UI.jersey(p.rec)}<span class="t">${esc(p.name)}<small>${this.statLine(p)}</small></span></div>`).join('')}</div>
        <div class="sec">Team stats</div><div class="box">${this.teamTable()}</div>
        <div class="acts" style="margin-top:14px"><button class="btn" data-home>Home</button><button class="btn hot" data-again style="flex:2;font-size:20px">One more game</button></div></div>`;
      BK.UI.show('results', false);
      el.querySelectorAll('[data-cu]').forEach((b) => { const to = +b.dataset.cu; let t0 = null; const st = (ts) => { t0 = t0 || ts; const u = Math.min(1, (ts - t0) / 900); b.textContent = BK.fmt(to * (1 - Math.pow(1 - u, 3))); if (u < 1) requestAnimationFrame(st); }; requestAnimationFrame(st); });
      A('reward'); if (r.levelUps.length) setTimeout(() => A('levelup'), 500);
      el.onclick = async (e) => {
        if (e.target.closest('[data-home]')) { A('tap'); BK.UI.stack = ['home']; BK.UI.show('home', false); }
        if (e.target.closest('[data-again]')) { A('tap'); BK.UI.stack = ['home']; this.start(); }
        if (e.target.closest('[data-share]')) this.share(sum, hl);
        const x2 = e.target.closest('[data-x2]');
        if (x2 && !this.adUsed) { this.adUsed = true; x2.disabled = true; await BK.UI.fakeAd(); G.S.coins += r.coins; G.S.buckets += r.buckets; G.addLB(r.buckets); G.save(); BK.UI.toast(`+🪙${BK.fmt(r.coins)} +🏆${BK.fmt(r.buckets)} bonus`); A('reward'); }
      };
      if (drop) setTimeout(() => { BK.UI.toast('First win bonus: a new player!'); BK.UI.reveal(drop); }, 900);
      if (sr && sr.done) setTimeout(() => BK.UI.seasonEnd(), drop ? 2600 : 1400);
    },
    share(sum, hl) {
      const G = BK.Game, p = hl.p;
      const m = BK.UI.modal(`<div class="share"><div class="court"></div><div class="brand">BUCK<span>E</span>TS · NBA AFK</div>
        <div><div class="line">${sum.win ? 'FINAL · W' : 'FINAL · L'} ${sum.home.score}–${sum.away.score} vs ${esc(sum.away.abbr)}</div><div class="head">${esc(hl.h)}</div></div>
        <div><div class="line">${esc(p.name.toUpperCase())}</div><div style="font:600 14px var(--ui)">${this.statLine(p)}</div><div style="font:600 13px var(--ui);color:var(--mute);margin-top:6px">${esc(G.S.teamName)} · Lv ${G.S.teamLevel}</div></div></div>
        <p class="small-note" style="text-align:center">Screenshot this card, or share the text.</p><div class="acts"><button class="btn pri" data-sh>Share</button></div>`);
      m.querySelector('[data-sh]').onclick = async () => {
        const text = `${hl.h} ${sum.home.score}-${sum.away.score} vs ${sum.away.abbr} 🏀 #BucketsNBAAFK`;
        try { if (navigator.share) await navigator.share({ text }); else { await navigator.clipboard.writeText(text); BK.UI.toast('Copied to clipboard'); } } catch (e) { BK.UI.toast('Screenshot the card to share'); }
      };
    },
    exit(toResults) {
      if (this.ir) this.endIR();
      this.active = false; this.replay = null; this.ff = false; this.irHold = false;
      document.body.classList.remove('in-match');
      BK.Audio.setInMatch(false);
      try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
      $('#match').innerHTML = '';
      if (!toResults) { BK.UI.stack = ['home']; BK.UI.show('home', false); }
    },
  });
  R.addEventListener('resize', () => MU.active && MU.orient());
  R.addEventListener('orientationchange', () => setTimeout(() => MU.active && MU.orient(), 200));
  document.addEventListener('visibilitychange', () => { if (document.hidden && MU.active && !MU.uiPause && !MU.introOpen && !MU.m.over) MU.pauseMenu(); });
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* BUCKETS — FIRST-LAUNCH DRAFT. Name your coach/team, get Curry, pick SG/SF/PF/C from interactive cards. */
(function (R) {
  const BK = (R.BK = R.BK || {});
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => BK.esc(s);
  const snd = (n) => BK.Audio && BK.Audio.play(n);
  const POSN = { PG: 'Point Guard', SG: 'Shooting Guard', SF: 'Small Forward', PF: 'Power Forward', C: 'Center' };

  const D = (BK.Draft = {
    start() {
      this.st = { step: 'welcome', picked: ['stephen_curry'], round: 0, opts: [], coach: '', team: '', sel: null };
      document.querySelectorAll('.screen').forEach((s) => s.classList.add('hidden'));
      $('#draft').classList.remove('hidden');
      this.render();
    },
    stars() { return this.st.picked.filter((id) => BK.displayOvr(BK.DB.get(id)) >= 90).length; },
    strip() {
      const rounds = ['PG'].concat(BK.Game.draftRounds());
      return `<div class="dr-strip">${rounds.map((p, i) => { const id = this.st.picked[i], r = id && BK.DB.get(id); return `<div class="dr-slot ${r ? 'on' : ''} ${i === this.st.round + 1 && this.st.step === 'round' ? 'now' : ''}"><span>${p}</span>${r ? BK.faceSVG(r, 30) : '<b>?</b>'}</div>`; }).join('')}</div>`;
    },
    stat(label, v) { return `<div class="dc-st"><span>${label}</span><i><b style="width:${v}%;${v >= 90 ? 'background:linear-gradient(90deg,#f6ce78,#fff1c4)' : ''}"></b></i><em>${v}</em></div>`; },
    card(id, i, big) {
      const r = BK.DB.get(id), a = r.attributes, ovr = BK.displayOvr(r), rar = BK.rarity(ovr), t = BK.team(r.team), star = ovr >= 90;
      const syn = (BK.SYN || []).filter(([x, y]) => (x === id && this.st.picked.includes(y)) || (y === id && this.st.picked.includes(x))).map(([, , v, n]) => `+${v} ${n}`);
      const mates = this.st.picked.filter((p) => p !== id && BK.DB.get(p).team === r.team).length;
      const chem = syn.concat(mates ? ['+3 Real teammates'] : []);
      return `<button class="dcard r-${rar} ${star ? 'star' : ''} ${big ? 'big' : ''}" data-dpick="${id}" style="--d:${i * 0.13}s">
        <div class="dc-in">
          <div class="dc-top"><span class="dc-ovr">${ovr}</span><span class="dc-pos">${r.pos.join('/')}</span></div>
          ${star ? '<span class="dc-ribbon">SUPERSTAR</span>' : `<span class="dc-ribbon soft">${BK.RARITY_LABEL[rar].toUpperCase()}</span>`}
          <div class="dc-face">${BK.faceSVG(r, 80)}</div>
          <div class="dc-name">${esc(r.name)}</div>
          <div class="dc-team"><i style="background:linear-gradient(135deg,${t.c1} 50%,${t.c2} 50%)"></i>${esc(t.full)}</div>
          <div class="dc-arch">${esc(BK.ARCH_LABEL[r.archetype] || '')}</div>
          <div class="dc-stats">${this.stat('3PT', a.threePoint)}${this.stat('SCR', BK.scoring(a))}${this.stat('PAS', a.passing)}${this.stat('DEF', BK.defence(a))}${this.stat('REB', a.rebounding)}</div>
          ${chem.length ? `<div class="dc-chem">⚡ ${esc(chem[0])}</div>` : ''}
        </div><div class="dc-shine"></div><div class="dc-stamp">SIGNED</div></button>`;
    },
    render() {
      const st = this.st, el = $('#draft');
      if (st.step === 'welcome') {
        el.innerHTML = `<div class="dr-wrap welcome">
          <div class="logo"><span class="b">BUCK<span>E</span>TS</span><span class="s">NBA AFK</span></div>
          <h2 class="dr-h">Welcome, Coach</h2><p class="dr-p">You're the GM. Draft a starting five, then watch them play. Name yourself and your squad — or skip, you can change it later.</p>
          <div class="dr-form"><input id="dCoach" maxlength="16" placeholder="Your coach name (optional)" autocomplete="off"><input id="dTeam" maxlength="18" placeholder="Team name (optional)" autocomplete="off"></div>
          <button class="btn hot dr-go" data-d="legend">Start the draft →</button></div>`;
      } else if (st.step === 'legend') {
        el.innerHTML = `<div class="dr-wrap"><div class="dr-k">EVERY FRANCHISE STARTS WITH A LEGEND</div>
          <div class="dr-cards one">${this.card('stephen_curry', 0, true)}</div>
          <p class="dr-p">Stephen Curry is your point guard. Now build around him — 4 rounds, 3 cards each. You'll land <b>at least 2 superstars</b>, and up to 3 if you chase them.</p>
          <button class="btn hot dr-go" data-d="round">Build around him →</button></div>`;
        setTimeout(() => { const c = el.querySelector('[data-dpick="stephen_curry"]'); if (c && this.st.step === 'legend') { c.classList.add('signed'); snd('card'); BK.buzz(25); } }, 650);
      } else if (st.step === 'round') {
        const pos = BK.Game.draftRounds()[st.round];
        if (!st.opts[st.round]) st.opts[st.round] = BK.Game.draftOptions(pos, st.picked, st.round);
        const stars = this.stars();
        el.innerHTML = `<div class="dr-wrap">${this.strip()}
          <div class="dr-k">ROUND ${st.round + 1} / 4 · ${stars} SUPERSTAR${stars === 1 ? '' : 'S'} SIGNED</div>
          <h2 class="dr-h">Pick your ${POSN[pos]}</h2>
          <div class="dr-cards">${st.opts[st.round].map((id, i) => this.card(id, i)).join('')}</div>
          <button class="btn hot dr-go" data-d="sign" disabled>Tap a card to choose</button></div>`;
        st.sel = null;
        snd('card');
      } else if (st.step === 'final') {
        const G = BK.Game, lineup = st.picked, bench = (st.bench = st.bench || G.draftBench(lineup));
        const chem = G.chemistry(lineup), pw = G.teamPower(lineup, bench);
        el.innerHTML = `<div class="dr-wrap"><div class="dr-k">YOUR STARTING FIVE</div><h2 class="dr-h">${esc(st.team || 'MY SQUAD')}</h2>
          <div class="dr-five">${lineup.map((id, i) => { const r = BK.DB.get(id); return `<div class="dr-mini r-${BK.rarity(BK.displayOvr(r))}" style="--d:${i * 0.1}s"><span>${BK.POSITIONS[i]}</span>${BK.faceSVG(r, 52)}<b>${BK.displayOvr(r)}</b><em>${esc(BK.lastName(r.name))}</em></div>`; }).join('')}</div>
          <div class="dr-meta"><div><b>${pw}</b>Team power</div><div><b>${chem.score}</b>Chemistry</div><div><b>${this.stars()}</b>Superstars</div></div>
          <div class="notes" style="justify-content:center">${chem.notes.filter((n) => n.v > 0 && !n.max).slice(0, 4).map((n) => `<span class="note ${n.syn ? 'syn' : ''}">${esc(n.t)} +${n.v}</span>`).join('')}</div>
          <p class="dr-p">Bench: ${bench.map((id) => esc(BK.DB.get(id).name)).join(' · ')}</p>
          <div class="acts" style="justify-content:center"><button class="btn" data-d="home">Go to home</button><button class="btn hot" data-d="tip" style="flex:2;font-size:20px">Tip off! 🏀</button></div></div>`;
        snd('levelup'); BK.buzz([20, 40, 20]);
      }
    },
    finish(play) {
      const st = this.st;
      BK.Game.finishDraft({ lineup: st.picked, bench: st.bench, coach: st.coach, team: st.team });
      $('#draft').classList.add('hidden');
      BK.UI.stack = ['home']; BK.UI.show('home', false);
      if (play) BK.MatchUI.start(); else setTimeout(() => BK.UI.legendGiftPrompt(), 400);
    },
    bind() {
      const el = $('#draft');
      el.addEventListener('click', (e) => {
        const d = e.target.closest('[data-d]'), c = e.target.closest('[data-dpick]'), st = this.st;
        if (c && st.step === 'round' && !c.classList.contains('signed')) {
          snd('tap'); BK.buzz(8);
          el.querySelectorAll('.dcard').forEach((x) => x.classList.toggle('sel', x === c));
          el.querySelectorAll('.dcard').forEach((x) => x.classList.toggle('dim', x !== c));
          st.sel = c.dataset.dpick;
          const b = el.querySelector('[data-d="sign"]'); b.disabled = false; b.textContent = 'Sign ' + BK.lastName(BK.DB.get(st.sel).name) + ' ✍️';
          return;
        }
        if (!d) return;
        const k = d.dataset.d;
        if (k === 'legend') { st.coach = ($('#dCoach').value || '').trim(); st.team = ($('#dTeam').value || '').trim().toUpperCase(); BK.Audio.init(); st.step = 'legend'; this.render(); }
        else if (k === 'round') { st.step = 'round'; this.render(); }
        else if (k === 'sign' && st.sel) {
          const card = el.querySelector(`[data-dpick="${st.sel}"]`); card.classList.add('signed'); snd('reward'); BK.buzz(25);
          d.disabled = true;
          setTimeout(() => { st.picked.push(st.sel); st.round++; st.step = st.round >= 4 ? 'final' : 'round'; this.render(); }, 750);
        }
        else if (k === 'tip') this.finish(true);
        else if (k === 'home') this.finish(false);
      });
      // 3D tilt + shine follow the finger/mouse
      el.addEventListener('pointermove', (e) => {
        const c = e.target.closest('.dcard'); if (!c) return;
        const b = c.getBoundingClientRect(), x = (e.clientX - b.left) / b.width, y = (e.clientY - b.top) / b.height;
        c.style.setProperty('--rx', (-(y - 0.5) * 14).toFixed(1) + 'deg'); c.style.setProperty('--ry', ((x - 0.5) * 18).toFixed(1) + 'deg');
        c.style.setProperty('--sx', (x * 100).toFixed(0) + '%'); c.style.setProperty('--sy', (y * 100).toFixed(0) + '%');
      });
      el.addEventListener('pointerleave', () => el.querySelectorAll('.dcard').forEach((c) => { c.style.setProperty('--rx', '0deg'); c.style.setProperty('--ry', '0deg'); }), true);
      el.addEventListener('pointerout', (e) => { const c = e.target.closest && e.target.closest('.dcard'); if (c && !c.contains(e.relatedTarget)) { c.style.setProperty('--rx', '0deg'); c.style.setProperty('--ry', '0deg'); } });
    },
  });
  BK.buzz = (pattern) => { try { if (BK.Game && BK.Game.S && BK.Game.S.haptics !== false && navigator.vibrate) navigator.vibrate(pattern); } catch (e) {} };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* BUCKETS — boot */
(function (R) {
  const BK = R.BK;
  function boot() {
    BK.Game.load();
    const S = BK.Game.S;
    BK.Audio.sound = S.settings.sound; BK.Audio.music = S.settings.music;
    BK.UI.bind(); BK.Draft.bind();
    if (!S.onboarded) BK.Draft.start();
    else { BK.UI.show('home'); if (!BK.UI.welcomeBack()) BK.UI.legendGiftPrompt(); }
    BK.Game.save();
    const unlock = () => { BK.Audio.init(); BK.Audio.setSound(S.settings.sound); BK.Audio.setMusic(S.settings.music); };
    document.addEventListener('pointerdown', unlock, { once: true, capture: true });
    setInterval(() => BK.UI.tickHome(), 1000);
    const persist = () => BK.Game.save();
    document.addEventListener('visibilitychange', () => { if (document.hidden) persist(); else if (!BK.MatchUI.active && BK.Game.S.onboarded) { BK.UI.welcomeBack(); BK.UI.refresh(); } });
    R.addEventListener('pagehide', persist);
    R.BK_READY = true;
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})(window);

</script>
